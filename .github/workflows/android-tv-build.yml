name: Android TV build

on:
  push:
    branches: ["main"]
    paths: ["android-tv/**", ".github/workflows/android-tv-build.yml"]
  # Deliberately unfiltered by path. This job is a required check on main, and
  # a required check that never runs is reported as pending forever, which
  # blocks the pull request instead of passing it. Every PR must produce a
  # verdict, including ones that touch no Android code.
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: myq-debug-apk
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
