name: Android TV build

on:
  push:
    branches: ["claude/android-tv-freeview-app-8qnz03"]
    paths: ["android-tv/**", ".github/workflows/android-tv-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: freeview-guide-debug-apk
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
